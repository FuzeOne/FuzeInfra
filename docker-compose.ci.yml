# CI-only overlay for docker-compose.FuzeInfra.yml.
# Merge it in CI:
#   docker-compose -f docker-compose.FuzeInfra.yml -f docker-compose.ci.yml up -d
#
# Purpose: keep the CI run clean and resource-light by NOT starting services that
# require external secrets and would crash-loop on a runner. Assigning a profile
# that is never activated means the service is simply not started, without
# touching the main compose file or local developer behaviour.
services:
  # cloudflare-tunnel needs a real CLOUDFLARE_TUNNEL_TOKEN; skip it in CI.
  cloudflare-tunnel:
    profiles: ["external-access"]

  # minio is not exercised by any CI test and minio/minio on Docker Hub now
  # requires authentication, causing the pull to fail with "access denied" and
  # aborting the entire docker-compose up.  Skip it in CI.
  minio:
    profiles: ["object-storage"]

  # dnsmasq tries to bind 0.0.0.0:53/udp on the host; GitHub Actions runners
  # already have systemd-resolved (or similar) listening on that port, causing
  # docker-compose up to fail with "address already in use".  CI tests connect
  # to services directly by localhost port and need no custom DNS resolution.
  dnsmasq:
    profiles: ["local-dns"]
