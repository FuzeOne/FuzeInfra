# ===========================================================================
# argocd-register
# ===========================================================================
# ONE-TIME registration of a consumer repo into the FuzeInfra cluster's ArgoCD.
#
# Supports two trigger modes:
#   1. workflow_dispatch (manual): for public repos or manual onboarding.
#      Pass repo, ref, path inputs — handler checks out the consumer repo.
#   2. repository_dispatch (type=argocd-register): for private repos or
#      automated dispatch on deploy/argocd/** changes.
#      Consumer bundles its deploy/argocd/ as base64-gzipped tar in
#      client_payload.argocd_bundle; handler extracts inline (no token needed).
#
# After the first registration, ArgoCD polls and self-syncs the consumer's
# deploy/argocd manifests — re-running this is safe (kubectl apply is idempotent)
# but normally unnecessary. Let ArgoCD own the steady state.
#
# Required repo secrets (FuzeInfra CI only):
#   KUBE_CONFIG   # base64 kubeconfig for the k3s server
#
# Example (manual, public repo):
#   gh workflow run argocd-register.yml \
#     -f repo=FuzeOne/FuzeFront -f ref=main -f path=deploy/argocd
#
# Example (automated dispatch from private repo infra-dispatch.yml):
#   jq -nc '{event_type:"argocd-register",
#            client_payload:{repo:"izzywdev/MendysRobotics", argocd_bundle:"<base64-tar>"}}' \
#     | gh api repos/FuzeOne/FuzeInfra/dispatches --input -

name: argocd-register

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Consumer repo to register (owner/name)"
        required: true
        type: string
      ref:
        description: "Ref to read the argo manifests from"
        required: false
        default: main
        type: string
      path:
        description: "Path in the consumer repo holding the Argo Application and AppProject manifests (AppProjects are policy-checked before apply; see scripts/validate_consumer_appproject.py)"
        required: false
        default: deploy/argocd
        type: string
  repository_dispatch:
    types: [argocd-register]

permissions:
  contents: read

concurrency:
  group: argocd-register-${{ github.event.client_payload.repo || inputs.repo }}
  cancel-in-progress: false

jobs:
  register:
    # Registration applies Argo Application manifests to the shared cluster.
    # Use GitHub-hosted capacity so this recovery/control-plane path remains
    # available when the in-cluster ARC runner scale set is unhealthy.
    runs-on: ubuntu-latest
    steps:
      # --- Inline bundle mode (private repo dispatch) --------------------------
      - name: Extract inline argocd bundle (repository_dispatch with argocd_bundle)
        if: github.event_name == 'repository_dispatch' && github.event.client_payload.argocd_bundle != ''
        run: |
          mkdir -p consumer/deploy/argocd
          echo "${{ github.event.client_payload.argocd_bundle }}" \
            | base64 -d \
            | tar -xz -C consumer/deploy/argocd --strip-components=0
          echo "Extracted inline argocd bundle from ${{ github.event.client_payload.repo }}"

      # --- Git checkout mode (workflow_dispatch or public repo) ----------------
      #
      # TOKEN MUST BE GH_TOKEN, NOT GITHUB_TOKEN. The built-in GITHUB_TOKEN is
      # scoped to THIS repository (FuzeInfra) and cannot read any other private
      # repo, so this step failed for every private consumer with a message that
      # reads like the repo does not exist:
      #
      #   remote: Repository not found.
      #   fatal: repository 'https://github.com/FuzeOne/FuzeFinance/' not found
      #
      # "Repository not found" is what GitHub returns for BOTH "absent" and
      # "present but this token cannot see it" -- it deliberately does not leak
      # the existence of private repos. So the message sends the reader looking
      # for a deleted repo when the repo is fine and the TOKEN is wrong. Verified
      # on FuzeFinance, FuzeExecutive and FuzeBI (runs 41-43), all three of which
      # exist and had their manifests on main at the time.
      #
      # This made the file's own header untrue in practice: it offers
      # workflow_dispatch "for public repos or manual onboarding" and
      # repository_dispatch "for private repos", but NOT ONE consumer repo in the
      # family implements the repository_dispatch side (measured: zero workflows
      # anywhere send event_type argocd-register). So for every private consumer
      # the documented path did not exist and the available path could not work.
      # Registration for private repos had therefore never succeeded by either
      # route.
      #
      # GH_TOKEN is the cross-repo token this repo already uses in 49 places, and
      # publish-sealed-handoff.yml demonstrably clones and pushes to these same
      # private consumer repos with it.
      - name: Guard GH_TOKEN is present
        if: github.event_name == 'workflow_dispatch' || github.event.client_payload.argocd_bundle == ''
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # Fail loudly and specifically. Without this the run dies later at
          # "Repository not found", which names the wrong problem.
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error title=argocd-register::GH_TOKEN is not set. The built-in GITHUB_TOKEN cannot read another private repo; a cross-repo token is required to check out the consumer's deploy/argocd manifests." >&2
            exit 1
          fi
          echo "GH_TOKEN present."

      - name: Check out consumer argo manifests (git checkout mode)
        if: github.event_name == 'workflow_dispatch' || github.event.client_payload.argocd_bundle == ''
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ github.event.client_payload.repo || inputs.repo }}
          ref: ${{ github.event.client_payload.ref || inputs.ref || 'main' }}
          path: consumer
          token: ${{ secrets.GH_TOKEN }}
          sparse-checkout: |
            ${{ inputs.path || 'deploy/argocd' }}


      # FuzeInfra's own policy files, for the gate in the register step. Sparse
      # and separate from `consumer/` so nothing from the consumer repo can
      # shadow the validator or the list of projects FuzeInfra holds.
      #
      # repository/ref are EXPLICIT on purpose. Today's triggers (dispatch only)
      # would default to this repo anyway, but if this workflow ever gains
      # `workflow_call`, the default becomes the CALLER's repo — a consumer could
      # then ship a no-op validator and an empty project list and pass every
      # rule. The gate's source must not depend on how the workflow was invoked.
      # `main`, not the triggering ref: policy is what has been reviewed and merged.
      - name: Check out FuzeInfra policy (validator + infra-held projects)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: FuzeOne/FuzeInfra
          ref: main
          path: infra
          sparse-checkout: |
            scripts/validate_consumer_appproject.py
            argocd/projects
            argocd/applications
          sparse-checkout-cone-mode: false

      # Install kubectl explicitly so this control-plane workflow remains
      # self-contained across runner image updates.
      - name: Install kubectl
        run: |
          if command -v kubectl >/dev/null 2>&1; then
            kubectl version --client --short 2>/dev/null || kubectl version --client 2>/dev/null | head -3
            exit 0
          fi
          # Pin to cluster minor version; kubectl supports ±1 minor from the server.
          KUBECTL_VERSION="v1.31.4"
          curl -fsSLo /tmp/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x /tmp/kubectl
          mkdir -p "$HOME/.local/bin"
          mv /tmp/kubectl "$HOME/.local/bin/kubectl"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Argo CD CLI
        run: |
          curl -fsSLo /tmp/argocd https://github.com/argoproj/argo-cd/releases/download/v3.4.4/argocd-linux-amd64
          mkdir -p "$HOME/.local/bin"
          install -m 0755 /tmp/argocd "$HOME/.local/bin/argocd"

      - name: Configure kubectl
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"

      - name: Register Argo Applications (one-time)
        run: |
          REPO="${{ github.event.client_payload.repo || inputs.repo }}"
          DIR="consumer/deploy/argocd"
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            DIR="consumer/${{ inputs.path || 'deploy/argocd' }}"
          fi
          if [ ! -d "$DIR" ]; then
            echo "::error::No argo manifests directory found at $DIR — nothing to register."
            exit 1
          fi
          echo "Registering Argo manifests from $DIR (repo: $REPO)..."
          # AppProjects ARE applied here — a deliberate reversal of the issue-#625
          # policy that filtered them out (PR #629). The owner decided (#639) that
          # consumers own their AppProject so they can manage their own
          # destination/resource allow-lists without a FuzeInfra PR for every
          # change. FuzeInfra's own AppProjects live in argocd/projects/ and are
          # applied by deploy-prod.yml, which is a separate path.
          #
          # #639 moved the FILE, not the POLICY: it kept #629's narrowing, and #99
          # (never a `fuzeinfra` destination) travels with every consumer project.
          # Nothing enforced either, and both broke: FuzeFront#1198 whitelisted
          # ClusterRole/ClusterRoleBinding (with the argocd destination, that is
          # cluster-admin), and the same project existed in both repos, so FuzeFront
          # deploys flapped and then froze (#1278). The gate runs BEFORE any apply;
          # a rejected registration applies nothing. Rules: the validator header.
          python3 -m pip install --quiet pyyaml
          python3 infra/scripts/validate_consumer_appproject.py \
            --infra-projects infra/argocd/projects \
            --infra-applications infra/argocd/applications \
            "$DIR"
          applications=""
          while IFS= read -r manifest; do
            resources=$(kubectl apply -f "$manifest" -o name)
            printf '%s\n' "$resources"
            applications="$applications $(printf '%s\n' "$resources" | sed -n 's#^application.argoproj.io/##p' | tr '\n' ' ')"
          done < <(find "$DIR" -type f \( -name '*.yaml' -o -name '*.yml' \) -print | sort)
          # Apply registers an Application but leaves its first reconciliation to
          # Argo's polling interval. Trigger a hard refresh + sync now so an
          # onboarding request has a deployed result rather than an indeterminate
          # wait. Workloads remain entirely GitOps-owned by their Application.
          for app in $applications; do
            phase=$(kubectl -n argocd get application "$app" -o jsonpath='{.status.operationState.phase}' 2>/dev/null || true)
            if [ "$phase" = Running ]; then
              echo "terminating stale in-flight sync for $app"
              argocd app terminate-op "$app" --core || true
              for _ in $(seq 1 30); do
                phase=$(kubectl -n argocd get application "$app" -o jsonpath='{.status.operationState.phase}' 2>/dev/null || true)
                [ "$phase" != Running ] && break
                sleep 2
              done
            fi
            kubectl -n argocd annotate application "$app" argocd.argoproj.io/refresh=hard --overwrite
            kubectl -n argocd patch application "$app" --type merge \
              -p '{"operation":{"initiatedBy":{"username":"argocd-register"},"sync":{}}}'
            echo "sync triggered for $app"
          done
          # Report the first reconciliation state, including render/sync errors,
          # so a successful registration cannot be mistaken for a deployment.
          sleep 15
          for app in $applications; do
            kubectl -n argocd get application "$app" \
              -o jsonpath="${app}: sync={.status.sync.status} health={.status.health.status} phase={.status.operationState.phase} message={.status.operationState.message}{'\n'}"
          done
          echo ""
          echo "Done. ArgoCD now owns these Applications and will self-sync future"
          echo "changes to deploy/argocd — do not re-run this for ordinary edits."
