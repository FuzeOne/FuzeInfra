name: Argo – Terminate stale operation

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Argo Application name (e.g. litellm, fuzeinfra-prod)'
        required: true
        default: 'litellm'

permissions:
  contents: read

concurrency:
  group: argo-terminate-op
  cancel-in-progress: false

jobs:
  terminate:
    runs-on: staging
    timeout-minutes: 120
    environment: production
    steps:
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0

      - name: Install Argo CD CLI
        run: |
          set -euo pipefail
          version=v3.4.2
          curl -fsSLO "https://github.com/argoproj/argo-cd/releases/download/${version}/argocd-linux-amd64"
          curl -fsSLO "https://github.com/argoproj/argo-cd/releases/download/${version}/cli_checksums.txt"
          grep ' argocd-linux-amd64$' cli_checksums.txt | sha256sum -c -
          sudo install -m0755 argocd-linux-amd64 /usr/local/bin/argocd

      - name: Configure kubectl
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -z "$KUBE_CONFIG" ]; then echo "::error::KUBE_CONFIG unset"; exit 1; fi
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Terminate stale operation
        env:
          APP: ${{ inputs.app }}
        run: |
          set -euo pipefail
          export KUBECONFIG="$HOME/.kube/config"
          # Do NOT rely on a context default namespace here: `argocd login --core`
          # below rewrites the kubeconfig context ("Context 'kubernetes' updated"),
          # which drops it. Every kubectl call in this job therefore names -n argocd
          # explicitly. Without that, Step 3 failed with `applications.argoproj.io
          # "fuzeinfra-prod" not found` AFTER steps 1-2 had already terminated the op —
          # the job reported failure on a terminate that had actually worked (seen
          # 2026-09-01, run 33512255005, dispatched by deployment-watchdog).
          kubectl config set-context --current --namespace=argocd

          echo "=== Current state of $APP ==="
          kubectl -n argocd get application "$APP" -o jsonpath='
          phase:        {.status.operationState.phase}
          syncRevision: {.status.operationState.syncResult.revision}
          syncStatus:   {.status.sync.status}
          headRevision:  {.status.sync.revision}
          operation:    {.operation}
          '
          echo ""
          echo ""

          phase=$(kubectl -n argocd get application "$APP" \
                    -o jsonpath='{.status.operationState.phase}' 2>/dev/null || echo "")

          if [ "$phase" != "Running" ]; then
            echo "Operation is not Running (phase=$phase) — nothing to terminate."
            exit 0
          fi

          # Pin every write below to THE operation this job was dispatched for.
          #
          # 2026-11-03 (run 41599096895): Step 1 terminated a stale op at 5a20309 at
          # 07:52:25; Argo auto-sync started the fresh op at fa92f09 — the very fix
          # the stale one was blocking — at 07:52:26. Step 1's re-check saw
          # phase=Running, which was now the NEW op, so Step 2 removed its .operation
          # and Step 3 marked it Failed. Argo's automated sync never retries a
          # revision whose sync failed, so prod stayed on the old revision with no
          # operation running and nothing left to notice.
          #
          # So: identify the op by its startedAt, stop the moment a different op is
          # Running, and make Steps 2-3 JSON patches whose leading `test` op makes
          # the API server reject them atomically if the op changed in between —
          # no check-then-write window.
          started=$(kubectl -n argocd get application "$APP" \
                      -o jsonpath='{.status.operationState.startedAt}' 2>/dev/null || echo "")
          if [ -z "$started" ]; then
            echo "::error::Running operation has no startedAt, so it cannot be told apart from a fresh one; refusing to touch it."
            exit 1
          fi
          orig_op=$(kubectl -n argocd get application "$APP" -o jsonpath='{.operation}' 2>/dev/null || echo "")
          echo "Stale operation: startedAt=$started"

          # 0 = the op we were dispatched for is still Running.
          # 1 = it is gone (terminated, finished, or replaced by a new op).
          still_stale() {
            local p s
            p=$(kubectl -n argocd get application "$APP" \
                  -o jsonpath='{.status.operationState.phase}' 2>/dev/null || echo "")
            s=$(kubectl -n argocd get application "$APP" \
                  -o jsonpath='{.status.operationState.startedAt}' 2>/dev/null || echo "")
            echo "phase: $p  startedAt: $s"
            if [ "$s" != "$started" ]; then
              echo "A new operation started at $s; it is not the stale one (startedAt $started). Leaving it alone."
              return 1
            fi
            [ "$p" = "Running" ]
          }

          # A rejected `test` patch means the op changed underneath us: success if
          # the stale op is gone, failure only if it is somehow still Running.
          guarded_patch() {
            if kubectl -n argocd patch application "$APP" --type=json -p "$1"; then
              return 0
            fi
            if still_stale; then
              echo "::error::patch failed while the stale operation is still Running"
              exit 1
            fi
            echo "Patch rejected because the operation changed; the stale one is gone."
            exit 0
          }

          echo "=== Step 1: argocd app terminate-op (core mode) ==="
          argocd login --core
          argocd app terminate-op "$APP" --core 2>&1 || echo "terminate-op returned non-zero"

          sleep 5
          echo "=== State after terminate-op ==="
          if ! still_stale; then
            echo "terminate-op succeeded."
            exit 0
          fi

          echo "=== Step 2: clear .operation field to stop retries ==="
          if [ -n "$orig_op" ]; then
            guarded_patch "[{\"op\":\"test\",\"path\":\"/operation\",\"value\":${orig_op}},{\"op\":\"remove\",\"path\":\"/operation\"}]"
          else
            echo "No .operation to clear."
          fi

          sleep 3
          if ! still_stale; then
            echo "Clearing .operation succeeded."
            exit 0
          fi

          echo "=== Step 3: patch the Application's status (no status subresource exists) ==="
          # Argo CD's Application CRD declares NO `status` subresource
          # (`kubectl get crd applications.argoproj.io -o jsonpath={.spec.versions[*].subresources}`
          # prints `{}`), so `--subresource=status` can only ever return
          # `applications.argoproj.io "<app>" not found`. That made this step dead code
          # on exactly the wedge it exists for: a stale `status.operationState.phase:
          # Running` with an empty `.operation`, where Step 1 says "No operation is in
          # progress" and Step 2 has nothing to remove (2026-10-14, run 38537354426,
          # fuzeinfra-prod stuck behind a crash-looping StatefulSet). `status` is an
          # ordinary field of the main resource here, so patch it there. The patch
          # touches only status.operationState.{phase,message}, and only while
          # startedAt is still the stale op's.
          guarded_patch "[{\"op\":\"test\",\"path\":\"/status/operationState/startedAt\",\"value\":\"${started}\"},{\"op\":\"add\",\"path\":\"/status/operationState/phase\",\"value\":\"Failed\"},{\"op\":\"add\",\"path\":\"/status/operationState/message\",\"value\":\"Force-terminated by CI: stale operation at old revision was blocking new syncs\"}]"

          sleep 3
          echo "=== Final state ==="
          kubectl -n argocd get application "$APP" -o jsonpath='
          phase:        {.status.operationState.phase}
          syncRevision: {.status.operationState.syncResult.revision}
          syncStatus:   {.status.sync.status}
          operation:    {.operation}
          '
          echo ""
          echo "=== Done ==="
