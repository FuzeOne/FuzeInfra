{{- if .Values.prometheus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: fuzeinfra-prometheus-config
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: fuzeinfra
        monitor: fuzeinfra-prometheus

    rule_files:
      - /etc/prometheus/rules/*.yml
      {{- if .Values.prometheus.ruleSidecar.enabled }}
      # Rules discovered from labeled ConfigMaps (see prometheus.ruleSidecar).
      - /etc/prometheus/rules-discovered/*.yml
      - /etc/prometheus/rules-discovered/*.yaml
      {{- end }}

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
              {{- if .Values.alertmanager.enabled }}
                - fuzeinfra-alertmanager:{{ .Values.alertmanager.port }}
              {{- end }}

    scrape_configs:
      # Prometheus self-monitoring
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      {{- if .Values.nodeExporter.enabled }}
      # Node Exporter — one instance per node via DaemonSet headless service
      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [{{ .Release.Namespace }}]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: fuzeinfra-node-exporter
          - source_labels: [__meta_kubernetes_endpoint_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
      {{- end }}

      {{- if .Values.kubeStateMetrics.enabled }}
      # kube-state-metrics — Kubernetes object state (pods, deployments, PVCs…)
      - job_name: kube-state-metrics
        static_configs:
          - targets: ["fuzeinfra-kube-state-metrics:8080"]
      {{- end }}

      # Kubelet node-level metrics (resource summary, volume stats)
      - job_name: kubernetes-nodes
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics

      # cAdvisor — per-container CPU, memory, network, filesystem
      - job_name: kubernetes-cadvisor
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
        metric_relabel_configs:
          # Keep only the metrics used by dashboards to avoid cardinality explosion
          - source_labels: [__name__]
            action: keep
            regex: >-
              container_cpu_usage_seconds_total|
              container_memory_working_set_bytes|
              container_memory_rss|
              container_network_receive_bytes_total|
              container_network_transmit_bytes_total|
              container_fs_reads_bytes_total|
              container_fs_writes_bytes_total|
              container_spec_memory_limit_bytes
          - source_labels: [container]
            action: drop
            regex: ""

      # Kubernetes API server
      - job_name: kubernetes-apiservers
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels:
              - __meta_kubernetes_namespace
              - __meta_kubernetes_service_name
              - __meta_kubernetes_endpoint_port_name
            action: keep
            regex: default;kubernetes;https

      # Grafana self-metrics
      {{- if .Values.grafana.enabled }}
      - job_name: grafana
        static_configs:
          - targets: ["fuzeinfra-grafana:{{ .Values.grafana.port }}"]
        metrics_path: /metrics
      {{- end }}

      # Alertmanager self-metrics
      {{- if .Values.alertmanager.enabled }}
      - job_name: alertmanager
        static_configs:
          - targets: ["fuzeinfra-alertmanager:{{ .Values.alertmanager.port }}"]
      {{- end }}

      # Loki self-metrics
      {{- if .Values.loki.enabled }}
      - job_name: loki
        static_configs:
          - targets: ["fuzeinfra-loki:{{ .Values.loki.port }}"]
      {{- end }}

      # Self-heal loop metrics (autofix issue/PR outcomes from the GitHub API)
      {{- if .Values.selfHealMetrics.enabled }}
      - job_name: selfheal-metrics
        static_configs:
          - targets: ["fuzeinfra-selfheal-metrics:{{ .Values.selfHealMetrics.port }}"]
      {{- end }}

      # Tempo self-metrics (ingester/compactor/metrics-generator health)
      {{- if .Values.tempo.enabled }}
      - job_name: tempo
        static_configs:
          - targets: ["fuzeinfra-tempo:{{ .Values.tempo.httpPort }}"]
      {{- end }}

      # otel-collector self-metrics (receive/export/drop counters) + its
      # prometheus exporter (OTLP metrics apps sent through it)
      {{- if .Values.otelCollector.enabled }}
      - job_name: otel-collector
        static_configs:
          - targets: ["fuzeinfra-otel-collector:8888"]
      - job_name: otel-collector-exported
        static_configs:
          - targets: ["fuzeinfra-otel-collector:{{ .Values.otelCollector.metricsPort }}"]
      {{- end }}

      # Any pod annotated with prometheus.io/scrape: "true"
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scheme]
            action: replace
            regex: (https?)
            target_label: __scheme__
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: app
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
{{- end }}

{{- if .Values.alertmanager.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fuzeinfra-alertmanager-config
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
data:
  alertmanager.yml: |
    global:
      resolve_timeout: {{ .Values.alertmanager.config.resolveTimeout | default "5m" }}
      {{- with .Values.alertmanager.config.global }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
    route:
      group_by: {{ toJson (.Values.alertmanager.config.groupBy | default (list "alertname" "namespace")) }}
      group_wait: {{ .Values.alertmanager.config.groupWait | default "30s" }}
      group_interval: {{ .Values.alertmanager.config.groupInterval | default "5m" }}
      repeat_interval: {{ .Values.alertmanager.config.repeatInterval | default "3h" }}
      receiver: {{ .Values.alertmanager.config.receiver | default "default" | quote }}
      {{- with .Values.alertmanager.routes }}
      routes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    receivers:
      {{- toYaml (.Values.alertmanager.receivers | default (list (dict "name" "default"))) | nindent 6 }}
    {{- with .Values.alertmanager.inhibitRules }}
    inhibit_rules:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{- end }}

{{- if .Values.loki.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fuzeinfra-loki-config
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
data:
  loki-config.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096

    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      storage:
        {{- if .Values.loki.s3.enabled }}
        s3:
          endpoint: {{ .Values.loki.s3.endpoint | quote }}
          region: {{ .Values.loki.s3.region | quote }}
          bucketnames: {{ .Values.loki.s3.bucket | quote }}
          access_key_id: ${LOKI_S3_ACCESS_KEY_ID}
          secret_access_key: ${LOKI_S3_SECRET_ACCESS_KEY}
          s3forcepathstyle: {{ .Values.loki.s3.s3ForcePathStyle }}
          insecure: {{ .Values.loki.s3.insecure }}
        {{- else }}
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
        {{- end }}
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    query_range:
      results_cache:
        cache:
          embedded_cache:
            enabled: true
            max_size_mb: 100

    schema_config:
      configs:
        - from: 2020-10-24
          store: tsdb
          object_store: {{ if .Values.loki.s3.enabled }}s3{{ else }}filesystem{{ end }}
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      reject_old_samples: false
      ingestion_rate_mb: 16
      ingestion_burst_size_mb: 32
      max_query_length: 721h
      # 336h = 14 days. Deliberately shortened from 744h (31 days) on 2026-09-01.
      # Loki OSS has NO size-based retention — only time — so this number, not the
      # PVC size, is the only knob that bounds growth from inside Loki. 31 days of
      # fleet logs from 22 repos overran a 5Gi volume, and a FULL Loki volume is
      # self-sealing (retention is enforced by the compactor, the compactor runs
      # inside Loki, and Loki cannot start on a full disk): it crash-looped 694
      # times over 2d11h and wedged an Argo sync in phase=Running for 37 hours,
      # silently freezing every prod deployment behind it. Two weeks is the
      # explicit decision — it covers the incident investigations this serves.
      # Shrinking this is safe and takes effect on the compactor's next run;
      # chunks older than the window are deleted, not orphaned.
      retention_period: 336h

    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: {{ if .Values.loki.s3.enabled }}s3{{ else }}filesystem{{ end }}

    ruler:
      alertmanager_url: http://fuzeinfra-alertmanager:{{ .Values.alertmanager.port }}
      {{- if .Values.loki.ruler.enabled }}
      # Until this block existed the ruler had an Alertmanager URL and nothing to
      # evaluate, so Loki raised no alert at all. Rules come from the
      # fuzeinfra-loki-rules ConfigMap (loki-rules/*.yaml), mounted read-only at
      # <directory>/fake/ (tenant "fake" because auth_enabled is false).
      # Explicit `local` storage also keeps rules out of the S3 bucket that
      # common.storage would otherwise select when loki.s3.enabled is on.
      enable_api: true
      storage:
        type: local
        local:
          directory: /etc/loki-rules
      # Scratch space the ruler rewrites rules into; must be writable, so it
      # lives on the data volume rather than under the read-only ConfigMap.
      rule_path: /loki/rules-temp
      {{- end }}

    analytics:
      reporting_enabled: false
{{- end }}

{{- if and .Values.loki.enabled .Values.loki.ruler.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fuzeinfra-loki-rules
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
data:
  {{- range $path, $_ := .Files.Glob "loki-rules/*.yaml" }}
  {{ base $path }}: |
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
{{- end }}

{{- if .Values.promtail.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fuzeinfra-promtail-config
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
data:
  config.yml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /run/promtail/positions.yaml

    clients:
      - url: http://fuzeinfra-loki:{{ .Values.loki.port }}/loki/api/v1/push
        tenant_id: fuzeinfra
        backoff_config:
          min_period: 500ms
          max_period: 5m
          max_retries: 10

    scrape_configs:
      # All pods across all namespaces
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        pipeline_stages:
          - cri: {}
          - labeldrop:
              - filename
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: __host__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: app
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            target_label: component
          - action: replace
            replacement: /var/log/pods/*$1/*.log
            separator: /
            source_labels:
              - __meta_kubernetes_pod_uid
              - __meta_kubernetes_pod_container_name
            target_label: __path__
          - action: replace
            regex: true/(.*)
            replacement: /var/log/pods/*$1/*.log
            separator: /
            source_labels:
              - __meta_kubernetes_pod_annotationpresent_kubernetes_io_config_hash
              - __meta_kubernetes_pod_annotation_kubernetes_io_config_hash
              - __meta_kubernetes_pod_container_name
            target_label: __path__
      {{- if .Values.promtail.journal.enabled }}
      # System journal (kernel, k3s/kubelet, systemd units) from every node.
      # This job existed for a long time with NO journal mounted into the
      # DaemonSet, so it read nothing: kernel EXT4 errors and kubelet mount
      # failures never reached Loki. The mounts are in monitoring.yaml, under the
      # same promtail.journal.enabled gate. With `path` unset Promtail reads the
      # default locations, /var/log/journal (persistent) and /run/log/journal
      # (volatile), so either journald storage mode works.
      - job_name: journal
        journal:
          max_age: 12h
          labels:
            job: systemd-journal
        pipeline_stages:
          - labeldrop:
              - filename
          # Debug priority is the bulk of k3s journal volume and nothing alerts on it.
          - match:
              selector: '{level="debug"}'
              action: drop
              drop_counter_reason: journal_debug
        relabel_configs:
          - source_labels: ['__journal__systemd_unit']
            target_label: unit
          - source_labels: ['__journal__hostname']
            target_label: node
          - source_labels: ['__journal_priority_keyword']
            target_label: level
      {{- end }}
{{- end }}

{{- if .Values.grafana.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fuzeinfra-grafana-datasources
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      {{- if .Values.prometheus.enabled }}
      - name: Prometheus
        type: prometheus
        access: proxy
        uid: fuzeinfra-prometheus
        url: http://fuzeinfra-prometheus:{{ .Values.prometheus.port }}
        isDefault: true
        jsonData:
          httpMethod: POST
          prometheusType: Prometheus
          cacheLevel: Low
          incrementalQueryOverlapWindow: 10m
          {{- if .Values.tempo.enabled }}
          # Jump from a metric sample's exemplar (a trace_id Prometheus stored
          # alongside it via --enable-feature=exemplar-storage) straight into the
          # trace that produced it.
          exemplarTraceIdDestinations:
            - datasourceUid: fuzeinfra-tempo
              name: trace_id
          {{- end }}
      {{- end }}
      {{- if .Values.loki.enabled }}
      - name: Loki
        type: loki
        access: proxy
        uid: fuzeinfra-loki
        url: http://fuzeinfra-loki:{{ .Values.loki.port }}
        jsonData:
          maxLines: 5000
          {{- if .Values.tempo.enabled }}
          # "Clicking trace_id should jump straight to Tempo" — apps must log a
          # structured `trace_id` field (see OBSERVABILITY_DASHBOARDS.md) for this
          # to match.
          derivedFields:
            - datasourceUid: fuzeinfra-tempo
              matcherRegex: "trace_id[=\"':\\s]+([0-9a-fA-F]+)"
              name: TraceID
              url: '${__value.raw}'
              urlDisplayLabel: "View trace"
          {{- end }}
      {{- end }}
      {{- if .Values.tempo.enabled }}
      - name: Tempo
        type: tempo
        access: proxy
        uid: fuzeinfra-tempo
        url: http://fuzeinfra-tempo:{{ .Values.tempo.httpPort }}
        jsonData:
          nodeGraph:
            enabled: true
          {{- if .Values.loki.enabled }}
          tracesToLogsV2:
            datasourceUid: fuzeinfra-loki
            spanStartTimeShift: '-5m'
            spanEndTimeShift: '5m'
            filterByTraceID: true
            tags:
              - key: service.name
                value: service
          lokiSearch:
            datasourceUid: fuzeinfra-loki
          {{- end }}
          {{- if .Values.prometheus.enabled }}
          tracesToMetrics:
            datasourceUid: fuzeinfra-prometheus
            tags:
              - key: service.name
                value: service
          serviceMap:
            datasourceUid: fuzeinfra-prometheus
          {{- end }}
      {{- end }}
{{- end }}

{{- /* ===================== Grafana Alerting Provisioning ===================== */ -}}
{{- if .Values.grafana.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fuzeinfra-grafana-alerting
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
data:
  # ---------------------------------------------------------------------------
  # Contact point — webhook to the CF Worker bridge that forwards to GHA, which
  # opens an `@fuze` issue so the fix runs through the canonical, VENDOR-INDEPENDENT
  # `@fuze` handler (fuze-cluster.yml → fuze-code-action's multi-provider cascade),
  # not a hardcoded single-vendor CLI. The receiver is named `fuze-autofix` for
  # that reason — the downstream mechanism is `@fuze`, not any one model vendor.
  # CRIT_BRIDGE_TOKEN env var is injected into the Grafana pod from
  # fuzeinfra-tunnel-secrets (created by terraform/contabo — ArgoCD never touches it).
  # If the var is empty, no Authorization header is sent (acceptable for
  # internal-only Worker URLs).
  # ---------------------------------------------------------------------------
  contact-points.yaml: |
    apiVersion: 1
    contactPoints:
      - orgId: 1
        name: fuze-autofix
        receivers:
          - uid: fuze-autofix-webhook
            type: webhook
            settings:
              url: "https://crit-alert.{{ .Values.global.domain }}/"
              httpMethod: POST
              authorizationScheme: Bearer
              authorizationCredentials: "${CRIT_BRIDGE_TOKEN}"
            disableResolveMessage: true
      {{- if .Values.alertSessionDispatcher.enabled }}
      # In-cluster dispatcher (docs/design/alert-to-agent-session.md). It applies its
      # own allowlist, dedup and caps; resolved notifications are sent so it can close
      # the per-fault record.
      - orgId: 1
        name: alert-session-dispatcher
        receivers:
          - uid: alert-session-dispatcher-webhook
            type: webhook
            settings:
              url: "http://alert-session-dispatcher.{{ .Release.Namespace }}.svc:8080/alerts"
              httpMethod: POST
              authorizationScheme: Bearer
              authorizationCredentials: "${ALERT_DISPATCH_INBOUND_TOKEN}"
            disableResolveMessage: false
      {{- end }}

  # ---------------------------------------------------------------------------
  # Notification policy — route severity=critical labels to the webhook.
  # All other alerts fall through to the default grafana receiver.
  # repeat_interval: 4h prevents flooding the @fuze handler with duplicate alerts.
  # ---------------------------------------------------------------------------
  policy.yaml: |
    apiVersion: 1
    policies:
      - orgId: 1
        receiver: fuze-autofix
        group_by: ['grafana_folder', 'alertname']
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
        routes:
          {{- if .Values.alertSessionDispatcher.enabled }}
          # Additive fan-out: `continue: true` keeps the existing @fuze issue path intact.
          - receiver: alert-session-dispatcher
            matchers:
              - severity = critical
            group_wait: 0s
            repeat_interval: 4h
            continue: true
          {{- end }}
          - receiver: fuze-autofix
            matchers:
              - severity = critical
            group_wait: 0s
            repeat_interval: 4h
            continue: false

  # ---------------------------------------------------------------------------
  # Alert rule — fires when any namespace logs contain ERROR/CRIT/FATAL/PANIC
  # in the last 5-minute window.  noDataState: OK so a quiet cluster does not
  # constantly re-trigger.  for: 0s means it fires on the first evaluation hit.
  # ---------------------------------------------------------------------------
  rules.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: crit-log-alerts
        # Distinct folder from the dashboards' "FuzeInfra" (folderUid
        # fuzeinfra-folder). Grafana's alert provisioning creates a folder by
        # TITLE and won't reuse the dashboard provider's pinned-uid folder, so a
        # shared "FuzeInfra" title produced a second, dashboard-empty "FuzeInfra"
        # folder. A distinct title keeps exactly one "FuzeInfra" (dashboards) +
        # one "FuzeInfra Alerts" (this rule).
        folder: FuzeInfra Alerts
        interval: 5m
        rules:
          - uid: critlogdetect
            title: CRIT Log Detected
            condition: C
            data:
              - refId: A
                queryType: range
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: fuzeinfra-loki
                model:
                  refId: A
                  expr: 'sum(count_over_time({namespace=~".+"} |~ "(?i)(ERROR|CRIT|CRITICAL|FATAL|PANIC)" [5m]))'
                  queryType: range
                  legendFormat: error count
                  intervalMs: 2000
                  maxDataPoints: 43200
              - refId: C
                queryType: ""
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: "-100"
                model:
                  type: classic_conditions
                  refId: C
                  datasource:
                    type: __expr__
                    uid: "-100"
                  conditions:
                    - evaluator:
                        params: [0]
                        type: gt
                      operator:
                        type: and
                      query:
                        params: [A]
                      reducer:
                        params: []
                        type: last
            noDataState: OK
            execErrState: OK
            for: 0s
            labels:
              severity: critical
            annotations:
              summary: "Error log message detected in FuzeInfra"
              description: "Found ERROR/CRIT/FATAL/PANIC log lines in the last 5 minutes. Claude is investigating."
            isPaused: false

      # -----------------------------------------------------------------------
      # Self-monitoring. Every Prometheus rule in helm/fuzeinfra/rules/*.yml is
      # evaluated BY Prometheus, so none can fire when Prometheus itself is the
      # casualty (2026-10-14: fuzeinfra-prometheus sat in ContainerCreating for
      # 13h on a Longhorn fsck failure, blocking the Argo sync; PrometheusDown is
      # absent(up{job="prometheus"}) evaluated by that same Prometheus, so it was
      # silent too). Grafana is a separate Deployment: these rules still evaluate
      # when Prometheus is down, and route through the same severity=critical ->
      # fuze-autofix -> crit-alert-bridge -> @fuze issue path as the rule above.
      #
      # The `alertname` label (the rule title) is what grafana-crit-fix.yml keys
      # its per-alert dedup on, so each title here must stay unique and stable.
      # -----------------------------------------------------------------------
      - orgId: 1
        name: self-monitoring
        folder: FuzeInfra Alerts
        interval: 1m
        rules:
          - uid: prometheusunreachable
            title: Prometheus Unreachable
            condition: C
            data:
              - refId: A
                queryType: ""
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: fuzeinfra-prometheus
                model:
                  refId: A
                  expr: 'up{job="prometheus"}'
                  instant: true
                  range: false
                  intervalMs: 1000
                  maxDataPoints: 43200
              - refId: C
                queryType: ""
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: "-100"
                model:
                  type: classic_conditions
                  refId: C
                  datasource:
                    type: __expr__
                    uid: "-100"
                  conditions:
                    - evaluator:
                        params: [1]
                        type: lt
                      operator:
                        type: and
                      query:
                        params: [A]
                      reducer:
                        params: []
                        type: last
            # The whole point: if the query errors (datasource down, timeout) or
            # returns nothing (series absent), Prometheus is unreachable -> alert.
            noDataState: Alerting
            execErrState: Alerting
            for: 10m
            labels:
              severity: critical
              namespace: fuzeinfra
            annotations:
              summary: "Prometheus is unreachable or not scraping itself"
              description: "Grafana could not read up{job=\"prometheus\"} from the fuzeinfra-prometheus datasource for 10 minutes (query error, no data, or value < 1). Prometheus is down, so every Prometheus-evaluated alert (PodPendingTooLong, DeploymentNoReplicasAvailable, PrometheusDown, ...) is blind. Check the pod's phase and events first: a pod stuck in ContainerCreating on a volume mount failure (Longhorn fsck) also blocks the Argo sync of fuzeinfra-prod."
            isPaused: false

      - orgId: 1
        name: storage-mount-log-alerts
        folder: FuzeInfra Alerts
        interval: 5m
        rules:
          - uid: storagemountfailure
            title: Storage Mount Failure
            condition: C
            data:
              - refId: A
                queryType: range
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: fuzeinfra-loki
                model:
                  refId: A
                  expr: 'sum(count_over_time({namespace="longhorn-system"} |~ "fsck.*(found errors|could not correct)|MountVolume.*failed|FailedAttachVolume" [10m]))'
                  queryType: range
                  legendFormat: mount failures
                  intervalMs: 2000
                  maxDataPoints: 43200
              - refId: C
                queryType: ""
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: "-100"
                model:
                  type: classic_conditions
                  refId: C
                  datasource:
                    type: __expr__
                    uid: "-100"
                  conditions:
                    - evaluator:
                        params: [0]
                        type: gt
                      operator:
                        type: and
                      query:
                        params: [A]
                      reducer:
                        params: []
                        type: last
            # Same convention as CRIT Log Detected: a quiet cluster (no matching
            # lines) must not alert. Loki being down is covered by the Loki/
            # promtail alerts, not here.
            noDataState: OK
            execErrState: OK
            for: 0s
            labels:
              severity: critical
              namespace: longhorn-system
            annotations:
              summary: "Longhorn volume mount/attach failure"
              description: "longhorn-system logs show a volume mount or attach failure (fsck found errors it could not correct, MountVolume failed, or FailedAttachVolume) in the last 10 minutes. A pod needing that volume is stuck in ContainerCreating; if it is Prometheus, the Argo sync of fuzeinfra-prod is blocked and no Prometheus alert can fire. Read the longhorn-csi-plugin pod logs and the pod events."
            isPaused: false
{{- end }}
