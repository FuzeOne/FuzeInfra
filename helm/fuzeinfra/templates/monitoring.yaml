{{- /* ===================== RBAC for Prometheus & Promtail SD ===================== */ -}}
{{- if or .Values.prometheus.enabled .Values.promtail.enabled (and .Values.grafana.enabled .Values.grafana.dashboardSidecar.enabled) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fuzeinfra-monitoring
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-fuzeinfra-monitoring
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "nodes/metrics", "nodes/stats", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    # list/watch across namespaces is required by the Grafana dashboard and
    # Prometheus rule discovery sidecars (kiwigrid/k8s-sidecar).
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-fuzeinfra-monitoring
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-fuzeinfra-monitoring
subjects:
  - kind: ServiceAccount
    name: fuzeinfra-monitoring
    namespace: {{ .Release.Namespace }}
{{- end }}

{{- /* ===================== Prometheus ===================== */ -}}
{{- if .Values.prometheus.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: fuzeinfra-prometheus
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
    {{- include "fuzeinfra.selectorLabels" (dict "component" "prometheus" "root" $) | nindent 4 }}
spec:
  selector:
    {{- include "fuzeinfra.selectorLabels" (dict "component" "prometheus" "root" $) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.prometheus.port }}
      targetPort: 9090
---
{{- /*
     Prometheus' TSDB volume is a STANDALONE PersistentVolumeClaim, deliberately NOT a
     StatefulSet volumeClaimTemplate. This mirrors the Loki conversion (#773), for the
     same two reasons plus one that was specific to this outage.

     WHY NOT A StatefulSet:
       1. Nothing here needs one. `replicas` is 1, the volume is ReadWriteOnce, the
          Service is a plain ClusterIP (the `serviceName` headless governance was never
          used), and single-binary Prometheus has no peers, no ordinals and no stable
          network identity requirement. A StatefulSet bought this workload nothing.
       2. A StatefulSet's .spec.volumeClaimTemplates is immutable, AND this chart's Argo
          Application hides that field from the sync entirely (ignoreDifferences +
          RespectIgnoreDifferences, argocd/applications/fuzeinfra-prod.yaml). That made
          `prometheus.storage` INERT — exactly as it had made `loki.storage` inert. A
          standalone PVC's spec.resources.requests.storage IS mutable (the `longhorn`
          class sets allowVolumeExpansion: true), so `prometheus.storage` below is now
          the real, enforced size: change it in Git, Argo applies it, Longhorn expands.

     That STS ignoreDifferences rule is NOT Prometheus-specific — it is keyed on
     `kind: StatefulSet` with no name, and postgres/mongodb/neo4j/kafka/elasticsearch/
     redis/rabbitmq/chromadb/alertmanager all depend on it to protect real data
     (2026-07-24 incident, in which Neo4j was LOST). It is left exactly as-is;
     Prometheus simply stops being a StatefulSet and therefore stops being in its scope.

     MIGRATION (2026-09-01) — WHY A FRESH VOLUME, NOT AN ADOPTION:
     `fuzeinfra-prometheus-0` sat in ContainerCreating for NINE DAYS. The Longhorn
     volume behind `data-fuzeinfra-prometheus-0` was itself healthy the whole time
     (state=attached, robustness=healthy, 3 running replicas) — the failure was one
     level down, a stale kernel mount on the attach node that pinned the block device:

       MountVolume.MountDevice failed for volume "pvc-b9657c07-9224-4a82-bf9a-9dc28c8e543a":
       rpc error: code = Internal desc = mount failed: exit status 32
       mount: .../globalmount: /dev/longhorn/pvc-b9657c07-9224-4a82-bf9a-9dc28c8e543a
       already mounted or mount point busy.      (x4458 over 6d7h)

     A leaked mount is a property of THAT device on THAT node, so it cannot be fixed
     from inside the chart and it does not clear on its own. For Loki, force-detaching
     the volume, restarting the CSI plugin and deleting the pod all failed; declaring a
     new claim — a different Longhorn volume, therefore a different device with no
     leaked mount — is what actually worked, and that pod has run since with 0 restarts.

     The cost is bounded and was worth paying: retention is 15d and the TSDB had already
     been frozen for 9 of those days, so most of what the old volume holds has aged out
     anyway, and the alternative is leaving the ENTIRE monitoring layer dark — with
     Prometheus down there are no endpoints, so every rule in helm/fuzeinfra/rules/ is
     inert, PVCFillingUp included.

     Declaring a fresh PVC also means Git and the cluster can never disagree on a PVC's
     IMMUTABLE fields (storageClassName, accessModes) — Argo creates it from exactly this
     spec, whereas adopting a live claim whose spec differs would wedge the sync
     permanently. The old claim is NOT deleted by this chart and must not be
     auto-deleted: `data-fuzeinfra-prometheus-0` stays Bound (the `longhorn` class is
     reclaimPolicy: Retain) so a human can mount it read-only to recover history, and
     remove it plus its Longhorn volume once the new one is confirmed healthy.

     MIGRATION 2 (2026-10-14) — ext4 CORRUPTION ON `fuzeinfra-prometheus-data`:
     after the unclean reboot of fuze-core-2/3 (~2026-10-13 14:00) kubelet's mount-time
     fsck of pvc-88752815 failed ("extent block passes checks, but checksum does not
     match extent", inode 1179654, "RUN fsck MANUALLY") on every one of ~400 attempts
     over 16h, while Longhorn reported attached/healthy with 3 running replicas — all
     three carry the same damaged filesystem, so a replica rebuild cannot help, and the
     Longhorn backup target is unconfigured (AVAILABLE=false), so there is no Longhorn
     backup to revert to. The wedged pod held Argo's sync operation in "waiting for
     healthy state of Deployment/fuzeinfra-prometheus" since 2026-10-05, which blocked
     every later deploy. Same cure as above: declare a fresh claim (`prometheus.pvcName`)
     and list the damaged one under `prometheus.retiredPvcs` so it is kept, not pruned.
     The cost is the TSDB history on the old volume (<=15d retention); the nightly S3
     snapshot (docs/backups-and-blobs.md §4) is the restore source if history matters.

     Deletion protection: `helm.sh/resource-policy: keep` stops a Helm uninstall from
     removing this claim, and Argo's `Prune=false` stops an Argo prune from removing it.
     A chart change can disable Prometheus without destroying its volume. Shrinking
     `storage` is rejected by the API server (expansion only) — that is intended.
*/}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.prometheus.pvcName }}
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
    {{- include "fuzeinfra.selectorLabels" (dict "component" "prometheus" "root" $) | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes: ["ReadWriteOnce"]
  {{- include "fuzeinfra.storageClass" . | nindent 2 }}
  resources:
    requests:
      storage: {{ .Values.prometheus.storage }}
{{- /*
     RETIRED CLAIMS stay DECLARED (never mounted by any pod) instead of being dropped
     from Git. Dropping one would leave Argo holding a live, Prune=false claim that
     is in no manifest — a permanent "requires pruning" OutOfSync, which is exactly
     what `deploy-prod`'s per-app Synced wait fails on. Declared + Prune=false +
     Retain keeps the old Longhorn volume intact for e2fsck / forensics / S3 compare
     until a human removes the entry (and then the claim and volume) on purpose.
     The spec must match what the claim was created with (storageClassName and
     accessModes are immutable), so these render through the same helper.
*/}}
{{- range .Values.prometheus.retiredPvcs }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ . }}
  labels:
    {{- include "fuzeinfra.labels" $ | nindent 4 }}
    {{- include "fuzeinfra.selectorLabels" (dict "component" "prometheus" "root" $) | nindent 4 }}
    fuzeinfra.io/retired: "true"
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes: ["ReadWriteOnce"]
  {{- include "fuzeinfra.storageClass" $ | nindent 2 }}
  resources:
    requests:
      # NOT prometheus.storage: growing the active volume must not also grow a
      # retired one nobody mounts (and that may hold a damaged filesystem).
      storage: {{ $.Values.prometheus.retiredPvcStorage | default "20Gi" }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fuzeinfra-prometheus
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Recreate, NOT RollingUpdate. LOAD-BEARING: the TSDB volume is ReadWriteOnce, so a
  # rolling update deadlocks — the new pod cannot mount the claim while the old pod
  # still holds it, the old pod is never terminated because the new one never becomes
  # Ready, and the rollout hangs until it is manually unstuck. Recreate tears the old
  # pod down first. The cost is a short scrape gap on every restart, which is the
  # correct trade for a single-replica Prometheus that already had exactly one pod.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "fuzeinfra.selectorLabels" (dict "component" "prometheus" "root" $) | nindent 6 }}
  template:
    metadata:
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
      labels:
        {{- include "fuzeinfra.labels" . | nindent 8 }}
        {{- include "fuzeinfra.selectorLabels" (dict "component" "prometheus" "root" $) | nindent 8 }}
        # Opt in to the admin-plane ingress lockdown (templates/networkpolicy-admin.yaml):
        # reachable only from this namespace and Traefik, never from another
        # namespace directly. This port is unauthenticated, and --web.enable-admin-api makes delete_series callable.
        # Removing this label silently removes that protection.
        fuzeinfra.io/ingress-profile: admin
    spec:
      serviceAccountName: fuzeinfra-monitoring
      securityContext:
        fsGroup: 65534
      containers:
        - name: prometheus
          image: {{ .Values.prometheus.image }}
          imagePullPolicy: {{ include "fuzeinfra.pullPolicy" . }}
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--web.enable-lifecycle'
            {{- if and .Values.backups.enabled .Values.backups.volumes.prometheus.enabled }}
            # Required by POST /api/v1/admin/tsdb/snapshot, which is the ONLY safe
            # way to copy a running TSDB (see backup-volume-cronjobs.yaml). Tied to
            # the backup switch rather than always-on, because the same admin API
            # also exposes delete_series/clean_tombstones to anything that can
            # reach 9090 in-cluster — there is no per-endpoint gate.
            - '--web.enable-admin-api'
            {{- end }}
            - '--storage.tsdb.retention.time={{ .Values.prometheus.retention.time | default "15d" }}'
            - '--storage.tsdb.retention.size={{ .Values.prometheus.retention.size | default "15GB" }}'
            {{- if .Values.tempo.enabled }}
            # Required for Tempo's metrics-generator (service-graphs + span-metrics)
            # to remote_write RED metrics here, and for exemplars — the trace_id
            # attached to a metric sample that Grafana uses to jump from a latency
            # spike straight into the trace that caused it.
            - '--web.enable-remote-write-receiver'
            - '--enable-feature=exemplar-storage'
            {{- end }}
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: rules
              mountPath: /etc/prometheus/rules
            - name: data
              mountPath: /prometheus
            {{- if .Values.prometheus.ruleSidecar.enabled }}
            - name: rules-discovered
              mountPath: /etc/prometheus/rules-discovered
            {{- end }}
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 10
          {{- with .Values.prometheus.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- if .Values.prometheus.ruleSidecar.enabled }}
        {{- /*
             DISCOVERED RULES ARE VALIDATED BEFORE PROMETHEUS EVER SEES THEM.
             The sidecar copies `prometheus_rule` ConfigMaps from EVERY namespace, and
             Prometheus treats one unparseable rule file as FATAL at startup. On
             2026-10-13 FuzeAgent shipped a LogQL expression as a Prometheus rule
             (fuzeagent/fuzeagent-incident-alerts): Prometheus crash-looped 4161 times
             over 15 days and metric alerting was off for every product.
             A startup-only check (#1512) was not enough, and that was measured on
             prod on 2026-11-03. When a reload POST is refused (Prometheus still
             replaying its WAL, ~2.5 min), the sidecar's watch loop throws and
             re-lists, re-writing every file, the bad one included, after the check
             has already run.
             So the sidecar writes to rules-staging/, which Prometheus never reads, and
             rule-validator (the Prometheus image, for its promtool) promotes only files
             that pass `promtool check rules` into rules-discovered/, then triggers the
             reload itself. A failing file costs its owner their rules, not everyone
             theirs. Its log line matches the Loki PrometheusRulesRejected rule.
        */}}
        - name: rule-sidecar
          image: {{ .Values.prometheus.ruleSidecar.image }}
          imagePullPolicy: {{ include "fuzeinfra.pullPolicy" . }}
          env:
            - name: LABEL
              value: {{ .Values.prometheus.ruleSidecar.label | quote }}
            - name: LABEL_VALUE
              value: {{ .Values.prometheus.ruleSidecar.labelValue | quote }}
            - name: FOLDER
              value: /etc/prometheus/rules-staging
            - name: RESOURCE
              value: configmap
            - name: NAMESPACE
              value: {{ .Values.prometheus.ruleSidecar.searchNamespace | quote }}
            - name: METHOD
              value: WATCH
            # No REQ_URL: rule-validator triggers /-/reload after promoting a file.
          resources:
            {{- toYaml .Values.prometheus.ruleSidecar.resources | nindent 12 }}
          volumeMounts:
            - name: rules-staging
              mountPath: /etc/prometheus/rules-staging
        - name: rule-validator
          image: {{ .Values.prometheus.image }}
          imagePullPolicy: {{ include "fuzeinfra.pullPolicy" . }}
          command:
            - /bin/sh
            - -c
            - |
              src=/etc/prometheus/rules-staging
              dst=/etc/prometheus/rules-discovered
              seen=/tmp/rejected
              mkdir -p "$seen"
              pass=0
              pending=0
              while :; do
                changed=0
                for f in "$src"/*.yaml "$src"/*.yml; do
                  [ -f "$f" ] || continue
                  n="${f##*/}"
                  cmp -s "$f" "$dst/$n" && continue
                  cmp -s "$f" "$seen/$n" && continue
                  if out="$(/bin/promtool check rules "$f" 2>&1)"; then
                    cp "$f" "$dst/.$n.tmp" && mv -f "$dst/.$n.tmp" "$dst/$n"
                    rm -f "$seen/$n"
                    echo "level=INFO msg=\"Rule file accepted\" file=$n"
                    changed=1
                  else
                    reason="$(printf '%s' "$out" | tr '\n"' " '")"
                    echo "level=ERROR msg=\"Error loading rule file, quarantined\" file=$n err=\"$reason\"" >&2
                    cp "$f" "$seen/$n"
                    if [ -f "$dst/$n" ]; then rm -f "$dst/$n"; changed=1; fi
                  fi
                done
                for f in "$dst"/*.yaml "$dst"/*.yml; do
                  [ -f "$f" ] || continue
                  n="${f##*/}"
                  if [ ! -f "$src/$n" ]; then rm -f "$f"; changed=1; fi
                done
                # Retried until it succeeds, so a change promoted while Prometheus is
                # still starting is not lost (it also reads them at startup).
                [ "$changed" = 1 ] && pending=1
                if [ "$pending" = 1 ]; then
                  if wget -q -O /dev/null --post-data= http://localhost:9090/-/reload 2>/dev/null; then
                    pending=0
                  fi
                fi
                [ -n "$VALIDATOR_ONCE" ] && exit 0
                # Forget rejections hourly so a still-bad file is logged again and
                # PrometheusRulesRejected keeps firing until its owner fixes it.
                pass=$((pass + 1))
                if [ "$pass" -ge 360 ]; then rm -f "$seen"/*; pass=0; fi
                sleep 10
              done
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits:   { memory: 64Mi }
          volumeMounts:
            - name: rules-staging
              mountPath: /etc/prometheus/rules-staging
              readOnly: true
            - name: rules-discovered
              mountPath: /etc/prometheus/rules-discovered
        {{- end }}
      {{- with .Values.prometheus.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.prometheus.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
        {{- include "fuzeinfra.durableTolerationItem" $ | nindent 8 }}
      {{- else }}
      {{- include "fuzeinfra.durableToleration" $ | nindent 6 }}
      {{- end }}
      volumes:
        - name: config
          configMap:
            name: fuzeinfra-prometheus-config
        - name: rules
          configMap:
            name: fuzeinfra-prometheus-rules
        {{- if .Values.prometheus.ruleSidecar.enabled }}
        - name: rules-discovered
          emptyDir: {}
        - name: rules-staging
          emptyDir: {}
        {{- end }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.prometheus.pvcName }}
{{- end }}

{{- /* ===================== Alertmanager ===================== */ -}}
{{- if .Values.alertmanager.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: fuzeinfra-alertmanager
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
    {{- include "fuzeinfra.selectorLabels" (dict "component" "alertmanager" "root" $) | nindent 4 }}
spec:
  selector:
    {{- include "fuzeinfra.selectorLabels" (dict "component" "alertmanager" "root" $) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.alertmanager.port }}
      targetPort: 9093
{{- if .Values.alertmanager.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fuzeinfra-alertmanager-data
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
    {{- include "fuzeinfra.selectorLabels" (dict "component" "alertmanager" "root" $) | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes: ["ReadWriteOnce"]
  {{- include "fuzeinfra.storageClass" . | nindent 2 }}
  resources:
    requests:
      storage: {{ .Values.alertmanager.storage }}
{{- end }}
---
{{- /*
     A Deployment, not a StatefulSet (changed 2026-11-03). The StatefulSet's
     volumeClaimTemplate volume (data-fuzeinfra-alertmanager-0, Longhorn
     pvc-d16da7af) lost 2 of its 3 replicas around the 2026-10-13 unclean reboot.
     Longhorn could not schedule new ones ("disks are unavailable"), and attach
     failed with "volume ... is not ready for workloads". The pod sat in
     ContainerCreating for 15 days. Two consequences:
       - nothing could deliver any alert, the Loki rules included;
       - Argo's fuzeinfra-prod sync waited on it ("waiting for healthy state of
         apps/StatefulSet/fuzeinfra-alertmanager"), queueing every later deploy.
     A StatefulSet cannot drop its volumeClaimTemplate (immutable, and hidden from
     Argo by the kind-wide ignoreDifferences), so the only Git fix is a different
     kind. Alertmanager's on-disk state is silences plus the notification log used
     to dedupe repeats, so emptyDir is the default: a restart loses silences and
     may re-send one notification per open alert. Set alertmanager.persistence.enabled
     for a standalone, expandable PVC (the Loki pattern) instead.
     The old PVC is left alone (STS-created, so not Argo-managed). Remove it and
     its Longhorn volume by hand once this is confirmed healthy.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fuzeinfra-alertmanager
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Recreate: never two Alertmanagers sending the same notification, and the
  # optional PVC is ReadWriteOnce.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "fuzeinfra.selectorLabels" (dict "component" "alertmanager" "root" $) | nindent 6 }}
  template:
    metadata:
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
      labels:
        {{- include "fuzeinfra.labels" . | nindent 8 }}
        {{- include "fuzeinfra.selectorLabels" (dict "component" "alertmanager" "root" $) | nindent 8 }}
        # Opt in to the admin-plane ingress lockdown (templates/networkpolicy-admin.yaml):
        # reachable only from this namespace and Traefik, never from another
        # namespace directly. This port is unauthenticated — a POSTed silence would blind the alerting plane.
        # Removing this label silently removes that protection.
        fuzeinfra.io/ingress-profile: admin
    spec:
      {{- with .Values.alertmanager.nodeSelector }}
      # Pin to durable (Longhorn-disk) nodes. Longhorn only registers a
      # node.longhorn.io object for nodes running longhorn-manager; a pod
      # scheduled elsewhere can never attach its volume.
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "fuzeinfra.durableToleration" $ | nindent 6 }}
      containers:
        - name: alertmanager
          image: {{ .Values.alertmanager.image }}
          imagePullPolicy: {{ include "fuzeinfra.pullPolicy" . }}
          args:
            - '--config.file=/etc/alertmanager/alertmanager.yml'
            - '--storage.path=/alertmanager'
          ports:
            - containerPort: 9093
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: data
              mountPath: /alertmanager
            {{- if .Values.alertmanager.githubBridge.enabled }}
            # Bearer token for the CF Worker bridge (Alertmanager → GitHub @fuze).
            - name: github-bridge-token
              mountPath: /etc/alertmanager/secrets
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: fuzeinfra-alertmanager-config
        - name: data
          {{- if .Values.alertmanager.persistence.enabled }}
          persistentVolumeClaim:
            claimName: fuzeinfra-alertmanager-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.alertmanager.githubBridge.enabled }}
        # Mounted as a FILE (not env) because Alertmanager does not substitute env
        # vars in its config; the webhook receiver references it via
        # http_config.authorization.credentials_file. See values.yaml alertmanager.githubBridge.
        - name: github-bridge-token
          secret:
            secretName: {{ .Values.alertmanager.githubBridge.tokenSecretName | default "fuzeinfra-tunnel-secrets" }}
            items:
              - key: {{ .Values.alertmanager.githubBridge.tokenSecretKey | default "CRIT_BRIDGE_TOKEN" }}
                path: crit_bridge_token
        {{- end }}
{{- end }}

{{- /* ===================== Grafana ===================== */ -}}
{{- if .Values.grafana.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: fuzeinfra-grafana
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
    {{- include "fuzeinfra.selectorLabels" (dict "component" "grafana" "root" $) | nindent 4 }}
spec:
  selector:
    {{- include "fuzeinfra.selectorLabels" (dict "component" "grafana" "root" $) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.grafana.port }}
      targetPort: 3000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fuzeinfra-grafana
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
spec:
  serviceName: fuzeinfra-grafana
  replicas: 1
  selector:
    matchLabels:
      {{- include "fuzeinfra.selectorLabels" (dict "component" "grafana" "root" $) | nindent 6 }}
  template:
    metadata:
      annotations:
        # Grafana provisions datasources/alerting/dashboards from ConfigMaps on
        # STARTUP only (its data dir is emptyDir/stateless). Without this, a
        # provisioning change applies to the ConfigMap but the running pod keeps
        # the stale config until manually restarted — which silently broke the
        # Loki-crit alerting for days. Hashing the config templates rolls the pod
        # whenever they change, so a provisioning edit reloads automatically.
        checksum/monitoring-config: {{ include (print $.Template.BasePath "/configmaps-monitoring.yaml") $ | sha256sum }}
        checksum/dashboards: {{ include (print $.Template.BasePath "/grafana-dashboards.yaml") $ | sha256sum }}
        # Roll when the admin-credential wiring changes, including a reseal.
        # Kubernetes does not restart a pod when a Secret changes (env is read
        # once at start), and the chart cannot hash a SealedSecret's ciphertext
        # because Argo applies it from outside the release. So bumping
        # adminPasswordSecret.rotation is what actually makes a rotated password
        # reach Grafana. Without this, a reseal silently leaves the OLD password
        # live and the new one only takes effect at the next unrelated restart.
        checksum/credentials: {{ .Values.grafana.adminPasswordSecret | toYaml | sha256sum }}
        {{- if .Values.grafana.persistence.enabled }}
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
        {{- end }}
      labels:
        {{- include "fuzeinfra.labels" . | nindent 8 }}
        {{- include "fuzeinfra.selectorLabels" (dict "component" "grafana" "root" $) | nindent 8 }}
        # Opt in to the admin-plane ingress lockdown (templates/networkpolicy-admin.yaml):
        # reachable only from this namespace and Traefik, never from another
        # namespace directly. This port is OIDC guards the UI, not the port.
        # Removing this label silently removes that protection.
        fuzeinfra.io/ingress-profile: admin
    spec:
      {{- if .Values.grafana.dashboardSidecar.enabled }}
      serviceAccountName: fuzeinfra-monitoring
      {{- end }}
      securityContext:
        fsGroup: 472
      {{- with .Values.grafana.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.grafana.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.grafana.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
        {{- include "fuzeinfra.durableTolerationItem" $ | nindent 8 }}
      {{- else }}
      {{- include "fuzeinfra.durableToleration" $ | nindent 6 }}
      {{- end }}
      containers:
        - name: grafana
          image: {{ .Values.grafana.image }}
          imagePullPolicy: {{ include "fuzeinfra.pullPolicy" . }}
          env:
            # Local break-glass admin password. Sourced from a dedicated Secret
            # when adminPasswordSecret.name is set, else from the chart-managed
            # fuzeinfra-secrets.
            #
            # The override exists because the chart default for this value is the
            # literal string "admin", and no environment overrode it — so prod was
            # rendering GRAFANA_ADMIN_PASSWORD: "admin" behind nothing but the
            # Cloudflare Access wall. Rotating it via fuzeinfra-secrets would mean
            # resealing that whole Secret, which also carries the Postgres, Mongo
            # and Neo4j passwords those live datastores are already using — a
            # coordinated credential rotation, not a config change. A separate
            # Secret keeps this fix contained and reversible.
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- with .Values.grafana.adminPasswordSecret }}
                  name: {{ .name | default (include "fuzeinfra.secretName" $) }}
                  key: {{ .key | default "GRAFANA_ADMIN_PASSWORD" }}
                  {{- else }}
                  name: {{ include "fuzeinfra.secretName" . }}
                  key: GRAFANA_ADMIN_PASSWORD
                  {{- end }}
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_FEATURE_TOGGLES_DASHBOARDNEWLAYOUTS
              value: "false"
            - name: GF_FEATURE_TOGGLES_DASHBOARDDEFAULTLAYOUTSELECTOR
              value: "false"
            - name: GF_UNIFIED_ALERTING_ENABLED
              value: "true"
            - name: CRIT_BRIDGE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fuzeinfra-tunnel-secrets
                  key: CRIT_BRIDGE_TOKEN
                  optional: true
            {{- if .Values.alertSessionDispatcher.enabled }}
            # Bearer for the in-cluster alert -> agent-session dispatcher webhook
            # (contact point `alert-session-dispatcher`, configmaps-monitoring.yaml).
            - name: ALERT_DISPATCH_INBOUND_TOKEN
              valueFrom:
                secretKeyRef:
                  name: alert-session-dispatcher-secret
                  key: ALERT_DISPATCH_INBOUND_TOKEN
            {{- end }}
            {{- if .Values.grafana.oidc.enabled }}
            # ---- Authentik SSO (generic OAuth) --------------------------------
            # GF_SECURITY_ADMIN_PASSWORD above is deliberately KEPT: /login still
            # accepts the local admin. Authentik depends on this cluster's own
            # Postgres+Redis, so an IdP outage must not lock us out of the
            # dashboards used to diagnose it.
            #
            # ROOT_URL is not optional — Grafana builds the OAuth redirect_uri
            # from it, and without it Authentik rejects the callback.
            - name: GF_SERVER_ROOT_URL
              value: "https://{{ include "fuzeinfra.host" (dict "root" . "sub" "grafana") }}/"
            - name: GF_AUTH_GENERIC_OAUTH_ENABLED
              value: "true"
            - name: GF_AUTH_GENERIC_OAUTH_NAME
              value: {{ .Values.grafana.oidc.displayName | quote }}
            - name: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
              value: {{ .Values.grafana.oidc.clientId | quote }}
            - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.grafana.oidc.secretName }}
                  key: {{ .Values.grafana.oidc.secretKey }}
            # `groups` is a custom scope on the Authentik provider; the role
            # mapping below is a no-op without it.
            - name: GF_AUTH_GENERIC_OAUTH_SCOPES
              value: "openid email profile groups"
            # These come off the GLOBAL /application/o/ base, not the per-app
            # issuer — see the note on grafana.oidc.endpointBase in values.yaml.
            - name: GF_AUTH_GENERIC_OAUTH_AUTH_URL
              value: "{{ .Values.grafana.oidc.endpointBase }}/authorize/"
            - name: GF_AUTH_GENERIC_OAUTH_TOKEN_URL
              value: "{{ .Values.grafana.oidc.endpointBase }}/token/"
            - name: GF_AUTH_GENERIC_OAUTH_API_URL
              value: "{{ .Values.grafana.oidc.endpointBase }}/userinfo/"
            # Grafana's SQLite lives in an emptyDir unless persistence.enabled,
            # so every login must be able to (re)create the user from claims.
            - name: GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP
              value: "true"
            - name: GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH
              value: {{ .Values.grafana.oidc.roleAttributePath | quote }}
            # Fail closed — but ONLY in combination with a roleAttributePath that
            # has no fallback branch. STRICT rejects a login when the JMESPath
            # yields NO role; it cannot help if the expression always returns
            # something. An earlier `... && 'Admin' || 'Viewer'` path always
            # returned a role, so this flag was inert and a groupless token was
            # auto-provisioned as a Viewer. Keep both halves or neither works.
            - name: GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT
              value: "true"
            {{- end }}
          ports:
            - containerPort: 3000
              name: http
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provisioning
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
            - name: alerting
              mountPath: /etc/grafana/provisioning/alerting
            {{- if .Values.grafana.dashboardSidecar.enabled }}
            - name: sidecar-dashboards
              mountPath: /var/lib/grafana/dashboards-discovered
            {{- end }}
            {{- if $.Files.Glob "dashboards/community/*.json" }}
            - name: community-dashboards
              mountPath: /var/lib/grafana/dashboards-community
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
        {{- if .Values.grafana.dashboardSidecar.enabled }}
        # k8s-sidecar: watches ConfigMaps labeled `{{ .Values.grafana.dashboardSidecar.label }}={{ .Values.grafana.dashboardSidecar.labelValue }}`
        # in {{ .Values.grafana.dashboardSidecar.searchNamespace }} and writes their JSON into the shared dashboards-discovered volume.
        - name: dashboard-sidecar
          image: {{ .Values.grafana.dashboardSidecar.image }}
          imagePullPolicy: {{ include "fuzeinfra.pullPolicy" . }}
          env:
            - name: LABEL
              value: {{ .Values.grafana.dashboardSidecar.label | quote }}
            - name: LABEL_VALUE
              value: {{ .Values.grafana.dashboardSidecar.labelValue | quote }}
            - name: FOLDER
              value: /var/lib/grafana/dashboards-discovered
            - name: RESOURCE
              value: configmap
            - name: NAMESPACE
              value: {{ .Values.grafana.dashboardSidecar.searchNamespace | quote }}
            - name: METHOD
              value: WATCH
            - name: FOLDER_ANNOTATION
              value: grafana_dashboard_folder
          resources:
            {{- toYaml .Values.grafana.dashboardSidecar.resources | nindent 12 }}
          volumeMounts:
            - name: sidecar-dashboards
              mountPath: /var/lib/grafana/dashboards-discovered
        {{- end }}
      volumes:
        {{- if not .Values.grafana.persistence.enabled }}
        # Stateless by default: Grafana's SQLite DB lives in an emptyDir, so the
        # pod carries no node-pinned state and can be rescheduled freely. All
        # datasources, dashboards and alerting are provisioned from ConfigMaps.
        - name: data
          emptyDir: {}
        {{- end }}
        - name: datasources
          configMap:
            name: fuzeinfra-grafana-datasources
        - name: dashboard-provisioning
          configMap:
            name: fuzeinfra-grafana-dashboard-provisioning
        - name: dashboards
          projected:
            sources:
              - configMap:
                  name: fuzeinfra-grafana-dashboard-cluster-overview
              - configMap:
                  name: fuzeinfra-grafana-dashboard-kubernetes-nodes
              - configMap:
                  name: fuzeinfra-grafana-dashboard-kubernetes-pods
              - configMap:
                  name: fuzeinfra-grafana-dashboard-fuzeinfra-services
              - configMap:
                  name: fuzeinfra-grafana-dashboard-logs-explorer
              - configMap:
                  name: fuzeinfra-grafana-dashboard-selfheal-loop
              - configMap:
                  name: fuzeinfra-grafana-dashboard-observability-stack
              - configMap:
                  name: fuzeinfra-grafana-dashboard-tracing
        - name: alerting
          configMap:
            name: fuzeinfra-grafana-alerting
        {{- if $.Files.Glob "dashboards/community/*.json" }}
        - name: community-dashboards
          projected:
            sources:
              {{- range $path, $_ := $.Files.Glob "dashboards/community/*.json" }}
              {{- $name := base $path | trimSuffix ".json" }}
              - configMap:
                  name: fuzeinfra-grafana-dashboard-community-{{ $name }}
              {{- end }}
        {{- end }}
        {{- if .Values.grafana.dashboardSidecar.enabled }}
        - name: sidecar-dashboards
          emptyDir: {}
        {{- end }}
  {{- if .Values.grafana.persistence.enabled }}
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- include "fuzeinfra.storageClass" . | nindent 8 }}
        resources:
          requests:
            storage: {{ .Values.grafana.storage }}
  {{- end }}
{{- end }}

{{- /* ===================== Loki ===================== */ -}}
{{- if .Values.loki.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: fuzeinfra-loki
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
    {{- include "fuzeinfra.selectorLabels" (dict "component" "loki" "root" $) | nindent 4 }}
spec:
  selector:
    {{- include "fuzeinfra.selectorLabels" (dict "component" "loki" "root" $) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.loki.port }}
      targetPort: 3100
---
{{- /*
     Loki's data volume is a STANDALONE PersistentVolumeClaim, deliberately NOT a
     StatefulSet volumeClaimTemplate.

     WHY: a StatefulSet's .spec.volumeClaimTemplates is immutable — the API server
     rejects any change to it ("updates to statefulset spec for fields other than
     'replicas', 'ordinals', 'template', ... are forbidden"), and this chart's Argo
     Application additionally hides that field from the sync entirely
     (ignoreDifferences + RespectIgnoreDifferences, argocd/applications/fuzeinfra-prod.yaml).
     The combination made `loki.storage` INERT: raising it 5Gi -> 20Gi in Git changed
     nothing on the running cluster, and the live volume could only be grown by a
     direct `kubectl patch pvc` — precisely the out-of-band mutation GitOps exists to
     eliminate. A standalone PVC's spec.resources.requests.storage IS mutable (the
     `longhorn` class sets allowVolumeExpansion: true), so `loki.storage` below is now
     the real, enforced size: change it in Git, Argo applies it, Longhorn expands.

     That STS ignoreDifferences rule is NOT Loki-specific — it is keyed on
     `kind: StatefulSet` with no name, and postgres/mongodb/neo4j/kafka/elasticsearch/
     redis/rabbitmq/prometheus/alertmanager/chromadb all depend on it to protect real
     data (2026-07-24 incident). It is left exactly as-is; Loki simply stops being a
     StatefulSet and therefore stops being in its scope.

     MIGRATION (2026-08-31): this is a NEW, EMPTY volume, deliberately not an
     adoption of the StatefulSet's old `data-fuzeinfra-loki-0` claim. Loki's content
     is disposable logs, and that old volume still holds the unreplayable WAL that
     produced the crash-loop ("building tsdb from old WAL files" -> "no space left on
     device"), so adopting it would carry the failure forward. Declaring a fresh PVC
     also means Git and the cluster can never disagree on a PVC's IMMUTABLE fields
     (storageClassName, accessModes) — Argo creates it from exactly this spec,
     whereas adopting a live claim whose spec differs would wedge the sync
     permanently. Loki re-ingests from Promtail on start; only historical logs are
     lost. The old claim is NOT deleted by this chart and must not be auto-deleted —
     a human should remove `data-fuzeinfra-loki-0` (and its Longhorn volume) once
     the new one is confirmed healthy.

     Deletion protection: `helm.sh/resource-policy: keep` stops a Helm uninstall from
     removing it, and Argo's `Prune=false` stops an Argo prune from removing it. A
     chart change can disable Loki without destroying its volume. Shrinking `storage`
     is rejected by the API server (expansion only) — that is intended.
*/}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fuzeinfra-loki-data
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
    {{- include "fuzeinfra.selectorLabels" (dict "component" "loki" "root" $) | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes: ["ReadWriteOnce"]
  {{- include "fuzeinfra.storageClass" . | nindent 2 }}
  resources:
    requests:
      storage: {{ .Values.loki.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fuzeinfra-loki
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Recreate, NOT RollingUpdate. LOAD-BEARING: the data volume is ReadWriteOnce, so
  # a rolling update deadlocks — the new pod cannot mount the claim while the old
  # pod still holds it, the old pod is never terminated because the new one never
  # becomes Ready, and the rollout hangs until it is manually unstuck. Recreate
  # tears the old pod down first. The cost is a short logging gap on every restart,
  # which is the correct trade for a single-replica, single-binary Loki.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "fuzeinfra.selectorLabels" (dict "component" "loki" "root" $) | nindent 6 }}
  template:
    metadata:
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
        {{- if .Values.loki.ruler.enabled }}
        # Loki reads its main config once at start, so a ruler change in Git must
        # roll the pod. Rule FILES are re-read by the ruler on its own poll and do
        # not need this.
        checksum/loki-ruler: {{ toJson .Values.loki.ruler | sha256sum }}
        {{- end }}
      labels:
        {{- include "fuzeinfra.labels" . | nindent 8 }}
        {{- include "fuzeinfra.selectorLabels" (dict "component" "loki" "root" $) | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: loki
          image: {{ .Values.loki.image }}
          imagePullPolicy: {{ include "fuzeinfra.pullPolicy" . }}
          args:
            - '-config.file=/etc/loki/loki-config.yaml'
            {{- if .Values.loki.s3.enabled }}
            - '-config.expand-env=true'
            {{- end }}
          {{- if .Values.loki.s3.enabled }}
          env:
            - name: LOKI_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ required "loki.s3.existingSecret is required when loki.s3.enabled=true" .Values.loki.s3.existingSecret }}
                  key: {{ .Values.loki.s3.accessKeyIdKey }}
            - name: LOKI_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.loki.s3.existingSecret }}
                  key: {{ .Values.loki.s3.secretAccessKeyKey }}
          {{- end }}
          ports:
            - containerPort: 3100
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: data
              mountPath: /loki
            {{- if .Values.loki.ruler.enabled }}
            # NOT under /etc/loki: that is a read-only ConfigMap volume, and the
            # kubelet cannot create a nested mount point inside it.
            - name: rules
              mountPath: /etc/loki-rules/fake
              readOnly: true
            {{- end }}
          readinessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 20
            periodSeconds: 10
          {{- with .Values.loki.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.loki.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.loki.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
        {{- include "fuzeinfra.durableTolerationItem" $ | nindent 8 }}
      {{- else }}
      {{- include "fuzeinfra.durableToleration" $ | nindent 6 }}
      {{- end }}
      volumes:
        - name: config
          configMap:
            name: fuzeinfra-loki-config
        - name: data
          persistentVolumeClaim:
            claimName: fuzeinfra-loki-data
        {{- if .Values.loki.ruler.enabled }}
        - name: rules
          configMap:
            name: fuzeinfra-loki-rules
        {{- end }}
{{- end }}

{{- /* ===================== Promtail (DaemonSet) ===================== */ -}}
{{- if .Values.promtail.enabled }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fuzeinfra-promtail
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "fuzeinfra.selectorLabels" (dict "component" "promtail" "root" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fuzeinfra.labels" . | nindent 8 }}
        {{- include "fuzeinfra.selectorLabels" (dict "component" "promtail" "root" $) | nindent 8 }}
    spec:
      serviceAccountName: fuzeinfra-monitoring
      # Promtail is a per-node log-collection agent, not chart workload: it must
      # run on EVERY node regardless of what else that node is dedicated to.
      # durableToleration alone only covers the "durable" taint, so the CI
      # runner nodes (tainted fuzeinfra.io/ci:NoSchedule) and any future
      # differently-tainted node silently lost log collection. `operator:
      # Exists` with no key/effect matches every taint, which is the standard
      # shape for a host-level DaemonSet (see node-exporter below).
      tolerations:
        - operator: Exists
      containers:
        - name: promtail
          image: {{ .Values.promtail.image }}
          imagePullPolicy: {{ include "fuzeinfra.pullPolicy" . }}
          args: ["-config.file=/etc/promtail/config.yml"]
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: run
              mountPath: /run/promtail
            - name: pods
              mountPath: /var/log/pods
              readOnly: true
            - name: containers
              mountPath: /var/lib/docker/containers
              readOnly: true
            {{- if .Values.promtail.journal.enabled }}
            # Read by the `journal` scrape job (configmaps-monitoring.yaml). Both
            # journald locations are mounted because which one holds the journal
            # depends on the node's Storage= setting.
            - name: journal-persistent
              mountPath: /var/log/journal
              readOnly: true
            - name: journal-volatile
              mountPath: /run/log/journal
              readOnly: true
            - name: machine-id
              mountPath: /etc/machine-id
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: fuzeinfra-promtail-config
        - name: run
          hostPath:
            path: /run/promtail
        - name: pods
          hostPath:
            path: /var/log/pods
        - name: containers
          hostPath:
            path: /var/lib/docker/containers
        {{- if .Values.promtail.journal.enabled }}
        # Same shape as Grafana's upstream promtail chart: no hostPath `type`, so
        # nothing is created or type-checked on the host. machine-id is needed
        # because with `path` unset the journal reader opens LOCAL journals only,
        # i.e. /var/log/journal/<machine-id>/; without the host's id it finds none.
        - name: journal-persistent
          hostPath:
            path: /var/log/journal
        - name: journal-volatile
          hostPath:
            path: /run/log/journal
        - name: machine-id
          hostPath:
            path: /etc/machine-id
        {{- end }}
{{- end }}

{{- /* ===================== Node Exporter (DaemonSet) ===================== */ -}}
{{- if .Values.nodeExporter.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: fuzeinfra-node-exporter
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
    {{- include "fuzeinfra.selectorLabels" (dict "component" "node-exporter" "root" $) | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "fuzeinfra.selectorLabels" (dict "component" "node-exporter" "root" $) | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.nodeExporter.port }}
      targetPort: 9100
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fuzeinfra-node-exporter
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "fuzeinfra.selectorLabels" (dict "component" "node-exporter" "root" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fuzeinfra.labels" . | nindent 8 }}
        {{- include "fuzeinfra.selectorLabels" (dict "component" "node-exporter" "root" $) | nindent 8 }}
    spec:
      hostNetwork: true
      hostPID: true
      # Same reasoning as promtail's toleration above: node-exporter must run on
      # every node to produce node_cpu_seconds_total/node_memory_* for ALL of
      # them. durableToleration only covers the "durable" taint, so the
      # fuzeinfra.io/ci:NoSchedule CI runner nodes never got a node-exporter
      # pod and silently dropped out of every CPU/Mem panel keyed on
      # node_exporter metrics (no time series existed for those instances at
      # all, not just "no data"). `operator: Exists` tolerates any taint.
      tolerations:
        - operator: Exists
      containers:
        - name: node-exporter
          image: {{ .Values.nodeExporter.image }}
          imagePullPolicy: {{ include "fuzeinfra.pullPolicy" . }}
          args:
            - '--path.procfs=/host/proc'
            - '--path.sysfs=/host/sys'
            - '--path.rootfs=/host/root'
            - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
          ports:
            - containerPort: 9100
              name: metrics
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
            - name: root
              mountPath: /host/root
              readOnly: true
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
        - name: root
          hostPath:
            path: /
{{- end }}
