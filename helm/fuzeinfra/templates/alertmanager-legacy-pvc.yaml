{{- /*
  TEMPORARY: GitOps adoption of the orphaned Alertmanager PVC, so Argo can prune it.

  `data-fuzeinfra-alertmanager-0` backed the Alertmanager StatefulSet until #1513 turned it
  into a Deployment on an emptyDir. The claim outlived the StatefulSet: it has no owner
  reference and no Argo tracking (it was hand-applied on 2026-07-26), and its Longhorn
  volume pvc-d16da7af lost 2 of 3 replicas ("disks are unavailable"). Nothing mounts it.

  Argo can only prune what it tracks, and no session may `kubectl delete` in prod. So:
    phase 1 (this file, adopt=true in values-contabo.yaml): render the claim with its exact
      live spec. Argo adopts it on sync (server-side apply; every field already matches,
      so nothing about the bound claim changes).
    phase 2 (adopt=false): the claim leaves the render and fuzeinfra-prod's
      `prune: true` deletes it. The longhorn StorageClass reclaim policy is Delete, so the
      dead Longhorn volume goes with it.
  Delete this file once phase 2 has landed. Guarded by tests/test_alertmanager_storage.py.
*/ -}}
{{- if and .Values.alertmanager.enabled .Values.alertmanager.legacyPvc.adopt }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-fuzeinfra-alertmanager-0
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  volumeMode: Filesystem
  volumeName: {{ required "alertmanager.legacyPvc.volumeName is required to adopt the legacy PVC" .Values.alertmanager.legacyPvc.volumeName | quote }}
  resources:
    requests:
      storage: 1Gi
{{- end }}
